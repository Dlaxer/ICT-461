<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device, initial-scale=1">
    <title>Supervision Register</title>
    <link rel="stylesheet" href="css/stylesheet" href="css/style.css">
</head>
<body>
    <main class="card">
        <h1>Supervision Register</h1>
        <p class="sub">Log your supervision meetings and get them verified.</p>

        <div class="tabs">
            <button id="tabLogin" class="active" type="button">Login</button>
            <button id="tabRegister" type="button">Register</button>
        </div>

    <p id="msg" class="msg" role="alert"></p>

    <form id="loginForm">
        <label>Email <input type="email" id="loginEmail" required></label>
        <label>Password <input type="password" id="loginPassword" required></label>
        <button type="submit">Login</button>
    </form>

    <form id="registerForm" hidden>
        <label>Full name <input id="fullName" required></label>
        <label>Student ID <input id="studentId" required></label>
        <label>Program <input id="program" placeholder="e.g. Bsc Of Science in Computer Science" required></label>
        <label>Supervisor
            <select id="superVisor" required>
                <ption value="">Loading Supervisors...</option>
            </select>
        </label>
        <label>Year
            <select id="year" required>
                <option value="">Select</option>
                <option>1</option><option>2</option><option>3</option>
                <option>4</option><option>5</option><option>6</option>
            </select>
        </label>
        <label>Email <input type="email" id="regEmail" required></label>
        <label>Password (min 6 characters)
            <input type="password" id="regPassword" minlength="6" required>
        </label>
        <button type="submit">Create account</button>
    </form>
    </main>
    <script type="module" src="js/auth.js"></script>
    </body>
</html>
